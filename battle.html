<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#08090c">

<title>Battle Arena | RES WARS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
  rel="stylesheet"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#08090c;
  --panel:#0e1015;
  --panel2:#13161c;
  --panel3:#181b22;
  --border:#242832;
  --border2:#303540;

  --text:#f5f7fb;
  --muted:#8e95a3;
  --muted2:#5f6672;

  --lime:#dfff00;
  --lime2:#ecff55;

  --success:#63e69d;
  --danger:#ff6565;
  --warning:#ffc95c;
}

html{
  background:var(--bg);
}

body{
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(223,255,0,.06),
      transparent 28%
    ),
    var(--bg);

  color:var(--text);

  font-family:Inter,sans-serif;

  -webkit-font-smoothing:antialiased;

  overflow-x:hidden;
}

button{
  font:inherit;
  cursor:pointer;
}

.hidden{
  display:none!important;
}


/* =========================================================
   HEADER
========================================================= */

header{
  height:70px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 28px;

  position:sticky;
  top:0;

  z-index:100;

  border-bottom:1px solid var(--border);

  background:rgba(8,9,12,.97);
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo{
  width:42px;
  height:42px;

  display:grid;
  place-items:center;

  border-radius:9px;

  background:var(--lime);
  color:#08090c;

  font-size:13px;
  font-weight:900;
}

.brand strong{
  display:block;

  font-size:13px;
  font-weight:900;

  letter-spacing:.05em;
}

.brand small{
  display:block;

  margin-top:3px;

  color:var(--muted);

  font-size:7px;
  font-weight:800;

  letter-spacing:.15em;
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.live-badge{
  display:flex;
  align-items:center;
  gap:7px;

  padding:8px 11px;

  border:1px solid rgba(255,101,101,.2);
  border-radius:30px;

  background:rgba(255,101,101,.04);
  color:#ff8c8c;

  font-size:7px;
  font-weight:900;

  letter-spacing:.1em;
}

.live-dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#ff6565;

  animation:pulse 1.2s infinite;
}

@keyframes pulse{

  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.35;
  }

}

.exit-btn{
  padding:9px 11px;

  border:1px solid var(--border);
  border-radius:8px;

  background:var(--panel);
  color:var(--muted);

  font-size:8px;
  font-weight:800;
}


/* =========================================================
   PAGE
========================================================= */

.page{
  width:min(100%,1050px);

  margin:auto;

  padding:34px 20px 70px;
}


/* =========================================================
   BATTLE TOP
========================================================= */

.battle-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:20px;

  margin-bottom:22px;
}

.battle-info .eyebrow{
  color:var(--lime);

  font-size:8px;
  font-weight:900;

  letter-spacing:.18em;
}

.battle-info h1{
  margin-top:8px;

  font-size:29px;

  letter-spacing:-.045em;
}

.battle-info p{
  margin-top:7px;

  color:var(--muted);

  font-size:9px;
}

.team-mini{
  text-align:right;
}

.team-mini small{
  color:var(--muted2);

  font-size:7px;
  font-weight:900;

  letter-spacing:.12em;
}

.team-mini strong{
  display:block;

  margin-top:5px;

  font-size:12px;
}

.team-mini span{
  display:block;

  margin-top:4px;

  color:var(--muted);

  font-size:8px;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-card{
  padding:16px 18px;

  display:grid;
  grid-template-columns:1fr auto;

  gap:20px;

  align-items:center;

  margin-bottom:16px;

  border:1px solid var(--border);
  border-radius:11px;

  background:var(--panel);
}

.progress-meta{
  display:flex;
  align-items:center;
  gap:17px;
}

.progress-item small{
  display:block;

  color:var(--muted2);

  font-size:7px;
  font-weight:900;

  letter-spacing:.1em;
}

.progress-item strong{
  display:block;

  margin-top:5px;

  font-size:12px;
}

.score{
  color:var(--lime);
}

.progress-bar{
  width:100%;

  height:4px;

  margin-top:12px;

  overflow:hidden;

  border-radius:10px;

  background:#20242c;
}

.progress-fill{
  height:100%;

  width:0%;

  border-radius:inherit;

  background:var(--lime);

  transition:width .4s ease;
}


/* =========================================================
   ARENA
========================================================= */

.arena{
  position:relative;

  min-height:520px;

  overflow:hidden;

  border:1px solid var(--border);
  border-radius:16px;

  background:
    radial-gradient(
      circle at 50% 15%,
      rgba(223,255,0,.06),
      transparent 32%
    ),
    linear-gradient(
      180deg,
      #111319,
      #0d0f13
    );
}

.arena::after{
  content:"RW";

  position:absolute;

  right:-40px;
  bottom:-75px;

  font-size:270px;
  font-weight:900;

  letter-spacing:-.13em;

  color:rgba(223,255,0,.018);

  pointer-events:none;
}

.arena-inner{
  position:relative;

  z-index:2;

  width:min(100%,760px);

  margin:auto;

  padding:45px 30px;
}


/* =========================================================
   WAITING STATE
========================================================= */

.center-state{
  min-height:430px;

  display:grid;
  place-items:center;

  text-align:center;
}

.center-state-inner{
  max-width:480px;
}

.state-icon{
  width:72px;
  height:72px;

  display:grid;
  place-items:center;

  margin:auto;

  border:1px solid var(--border2);
  border-radius:50%;

  background:var(--panel2);

  font-size:29px;
}

.center-state h2{
  margin-top:22px;

  font-size:28px;

  letter-spacing:-.04em;
}

.center-state p{
  margin-top:11px;

  color:var(--muted);

  font-size:10px;
  line-height:1.7;
}


/* =========================================================
   QUESTION
========================================================= */

.round-label{
  text-align:center;

  color:var(--lime);

  font-size:8px;
  font-weight:900;

  letter-spacing:.18em;
}

.question{
  max-width:700px;

  margin:20px auto 0;

  text-align:center;

  font-size:clamp(27px,5vw,43px);
  line-height:1.12;

  letter-spacing:-.05em;
}

.instructions{
  margin-top:14px;

  text-align:center;

  color:var(--muted);

  font-size:9px;
  line-height:1.6;
}


/* =========================================================
   TIMER
========================================================= */

.timer-wrap{
  margin:28px auto 0;

  text-align:center;
}

.timer-ring{
  width:70px;
  height:70px;

  display:grid;
  place-items:center;

  margin:auto;

  border:2px solid var(--lime);
  border-radius:50%;

  background:rgba(223,255,0,.025);
}

.timer-ring.warning{
  border-color:var(--warning);
  color:var(--warning);
}

.timer-ring.danger{
  border-color:var(--danger);
  color:var(--danger);
}

.timer-ring strong{
  font-size:21px;
}

.timer-wrap small{
  display:block;

  margin-top:8px;

  color:var(--muted2);

  font-size:7px;
  font-weight:900;

  letter-spacing:.1em;
}


/* =========================================================
   ANSWERS
========================================================= */

.answer-grid{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:12px;

  margin-top:32px;
}

.answer-btn{
  min-height:150px;

  padding:22px;

  border:1px solid var(--border);
  border-radius:13px;

  background:var(--panel);
  color:var(--text);

  transition:
    border-color .18s ease,
    transform .18s ease,
    background .18s ease;
}

.answer-btn:hover{
  transform:translateY(-2px);

  border-color:var(--lime);

  background:var(--panel2);
}

.answer-btn:disabled{
  cursor:not-allowed;

  opacity:.45;

  transform:none;
}

.answer-btn.selected{
  border-color:var(--lime);

  background:rgba(223,255,0,.06);

  box-shadow:
    inset 0 0 0 1px rgba(223,255,0,.08);
}

.answer-avatar{
  width:48px;
  height:48px;

  display:grid;
  place-items:center;

  margin:auto;

  border-radius:50%;

  background:var(--panel3);

  font-size:12px;
  font-weight:900;
}

.answer-btn.selected .answer-avatar{
  background:var(--lime);
  color:#08090c;
}

.answer-btn strong{
  display:block;

  margin-top:16px;

  text-align:center;

  font-size:12px;
}

.answer-btn span{
  display:block;

  margin-top:6px;

  text-align:center;

  color:var(--muted);

  font-size:8px;
}


/* =========================================================
   ANSWERED
========================================================= */

.answer-locked{
  margin-top:23px;

  padding:13px 15px;

  text-align:center;

  border:1px solid rgba(99,230,157,.18);
  border-radius:8px;

  background:rgba(99,230,157,.04);
  color:#98efba;

  font-size:8px;
  font-weight:800;

  letter-spacing:.07em;
}


/* =========================================================
   SCORE BOARD
========================================================= */

.score-card{
  margin-top:16px;

  padding:20px;

  border:1px solid var(--border);
  border-radius:11px;

  background:var(--panel);
}

.score-head{
  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:15px;
}

.score-head h3{
  font-size:11px;
}

.score-head span{
  color:var(--muted);

  font-size:7px;
}

.room-rank-row{
  display:grid;
  grid-template-columns:40px 1fr auto;

  align-items:center;

  padding:12px 0;

  border-bottom:1px solid var(--border);
}

.room-rank-row:last-child{
  border-bottom:0;
}

.room-position{
  font-size:9px;
  font-weight:900;

  color:var(--muted);
}

.room-position.top{
  color:var(--lime);
}

.room-rank-name strong{
  display:block;

  font-size:9px;
}

.room-rank-name small{
  display:block;

  margin-top:3px;

  color:var(--muted2);

  font-size:7px;
}

.room-rank-score{
  font-size:9px;
  font-weight:900;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;

  right:18px;
  bottom:18px;

  z-index:3000;

  width:min(360px,calc(100% - 36px));

  padding:14px 15px;

  border:1px solid var(--border2);
  border-radius:9px;

  background:#12151b;

  box-shadow:
    0 20px 70px rgba(0,0,0,.5);

  font-size:9px;
  line-height:1.6;
}

.toast.success{
  color:#9ceebb;

  border-color:rgba(99,230,157,.25);
}

.toast.error{
  color:#ff9d9d;

  border-color:rgba(255,101,101,.25);
}


/* =========================================================
   LOADER
========================================================= */

.loader{
  position:fixed;

  inset:0;

  z-index:9999;

  display:grid;
  place-items:center;

  background:#08090c;
}

.loader-box{
  text-align:center;
}

.loader-logo{
  width:55px;
  height:55px;

  display:grid;
  place-items:center;

  margin:auto;

  border-radius:11px;

  background:var(--lime);
  color:#08090c;

  font-weight:900;
}

.spinner{
  width:24px;
  height:24px;

  margin:20px auto;

  border:2px solid #303540;
  border-top-color:var(--lime);
  border-radius:50%;

  animation:spin .65s linear infinite;
}

.loader p{
  color:var(--muted);

  font-size:8px;
  font-weight:900;

  letter-spacing:.12em;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:680px){

  header{
    height:64px;

    padding:0 15px;
  }

  .brand small{
    display:none;
  }

  .live-badge{
    display:none;
  }

  .page{
    padding:24px 14px 45px;
  }

  .battle-top{
    align-items:flex-start;
    flex-direction:column;
  }

  .team-mini{
    text-align:left;
  }

  .progress-card{
    grid-template-columns:1fr;
  }

  .progress-meta{
    justify-content:space-between;
  }

  .arena-inner{
    padding:36px 18px;
  }

  .answer-grid{
    grid-template-columns:1fr;
  }

  .answer-btn{
    min-height:110px;

    display:grid;
    grid-template-columns:46px 1fr;

    align-items:center;

    gap:15px;

    text-align:left;
  }

  .answer-avatar{
    margin:0;
  }

  .answer-btn strong,
  .answer-btn span{
    text-align:left;
  }

  .answer-btn strong{
    margin-top:0;
  }

}

</style>
</head>

<body>

     HEADER
========================================================= -->

>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   CONFIG
========================================================= */

const SUPABASE_URL =
  "https://tkfnypzohdercxljswfe.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_MFJw5HdM0uJvj_MC70mJgg_RPRm5Gra";


const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let user = null;

let profile = null;

let room = null;

let members = [];

let session = null;

let game = null;

let currentRound = null;

let currentQuestion = null;

let myAnswer = null;

let sessionRooms = [];

let battleRoom = null;

let timerInterval = null;

let sessionChannel = null;

let roundsChannel = null;

let answersChannel = null;

let scoreChannel = null;


/* =========================================================
   ELEMENT HELPERS
========================================================= */

const $ =
  id =>
    document.getElementById(id);


function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function initials(name){

  return String(name || "RW")
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .slice(0,2)
    .map(
      word =>
        word[0]
    )
    .join("")
    .toUpperCase()
    ||
    "RW";

}


function toast(
  text,
  type = "success"
){

  const element =
    $("toast");


  element.textContent =
    text;


  element.className =
    `toast ${type}`;


  clearTimeout(
    toast.timer
  );


  toast.timer =
    setTimeout(
      () => {

        element
          .classList
          .add("hidden");

      },
      4000
    );

}


function hideLoader(){

  $("loader")
    .classList
    .add("hidden");

}


function showFatal(text){

  $("loaderText")
    .textContent =
      text;


  const spinner =
    document.querySelector(
      ".spinner"
    );


  if(spinner){

    spinner.style.display =
      "none";

  }

}


function getSessionId(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  return params.get(
    "session"
  );

}


/* =========================================================
   ROOM MEMBERS
========================================================= */

async function loadMembers(){

  const {
    data: links,
    error
  } =
    await sb
      .from("room_members")
      .select(`
        user_id,
        joined_at
      `)
      .eq(
        "room_id",
        room.id
      )
      .order(
        "joined_at",
        {
          ascending:true
        }
      );


  if(error){
    throw error;
  }


  if(!links?.length){

    members = [];

    return;

  }


  const ids =
    links.map(
      item =>
        item.user_id
    );


  const {
    data: profiles,
    error: profileError
  } =
    await sb
      .from("profiles")
      .select(`
        id,
        full_name
      `)
      .in(
        "id",
        ids
      );


  if(profileError){
    throw profileError;
  }


  members =
    links.map(
      link => ({

        ...link,

        profile:
          profiles.find(
            item =>
              item.id ===
              link.user_id
          )

      })
    );

}


/* =========================================================
   SESSION
========================================================= */

async function loadSession(){

  const sessionId =
    getSessionId();


  if(!sessionId){

    throw new Error(
      "Battle session is missing."
    );

  }


  const {
    data,
    error
  } =
    await sb
      .from("game_sessions")
      .select(`
        id,
        residence_id,
        game_id,
        title,
        status,
        scheduled_for,
        started_at,
        ended_at,
        current_round,
        total_rounds
      `)
      .eq(
        "id",
        sessionId
      )
      .single();


  if(error){
    throw error;
  }


  session =
    data;


  const {
    data: gameData,
    error: gameError
  } =
    await sb

      `)

========================================================= */

async function verifyBattleRoom(){

  const {
    data,
    error
  } =
    await sb
      .from("session_rooms")
      .select(`
        id,
        session_id,
        room_id,
        score,
        xp_earned,

      `)
      .eq(

      )
      .eq(
        "room_id",
        room.id
      )
      .maybeSingle();


  if(error){
    throw error;
  }


  if(!data){

    throw new Error(
      "Your room did not join this battle."
    );

  }


  if(

  battleRoom =

/* =========================================================
   BATTLE SCORES
========================================================= */

async function loadBattleLeaderboard(){

  const {
    data,
    error
  } =
    await sb
      .from("session_rooms")
      .select(`
        id,
        room_id,
        score,
        status,
        joined_at
      `)
      .eq(
        "session_id",
        session.id
      )
      .neq(
        "status",
        "disqualified"
      )
      .order(
        "score",
        {
          ascending:false
        }
      )
      .order(
        "joined_at",
        {
          ascending:true
        }
      );


  if(error){
    throw error;
  }


  const links =
    data || [];


  if(!links.length){

    sessionRooms = [];

    renderLeaderboard();

    return;

  }


  const ids =
    links.map(
      item =>
        item.room_id
    );


  const {
    data: roomData,
    error: roomError
  } =
    await sb
      .from("rooms")
      .select(`
        id,
        room_number,
        team_name
      `)
      .in(
        "id",
        ids
      );


  if(roomError){
    throw roomError;
  }


  sessionRooms =
    links.map(
      link => ({

        ...link,

        room:
          roomData.find(
            item =>
              item.id ===
              link.room_id
          )

      })
    );


  battleRoom =
    links.find(
      item =>
        item.room_id ===
        room.id
    )
    ||
    battleRoom;


  renderLeaderboard();

  renderProgress();

}


/* =========================================================
   LEADERBOARD RENDER
========================================================= */

function renderLeaderboard(){

  $("joinedRoomsLabel")
    .textContent =
      `${sessionRooms.length} ROOM${
        sessionRooms.length === 1
          ? ""
          : "S"
      }`;


  if(!sessionRooms.length){

    $("battleLeaderboard")
      .innerHTML =
        `
          <div
            style="
              padding:25px 0;
              color:var(--muted);
              text-align:center;
              font-size:9px;
            "
          >
            No battle scores yet.
          </div>
        `;

    return;

  }


  $("battleLeaderboard")
    .innerHTML =
      sessionRooms
        .slice(0,10)
        .map(
          (entry,index) => {

            const team =
              entry.room?.team_name ||
              `Room ${entry.room?.room_number || "?"}`;


            return `
              <div class="room-rank-row">

                <div
                  class="room-position ${
                    index < 3
                      ? "top"
                      : ""
                  }"
                >
                  #${index + 1}
                </div>


                <div class="room-rank-name">

                  <strong>
                    ${esc(team)}
                    ${
                      entry.room_id ===
                      room.id
                        ?
                        `<span
                          style="
                            color:var(--lime);
                            font-size:7px;
                            margin-left:5px;
                          "
                        >
                          YOU
                        </span>`
                        :
                        ""
                    }
                  </strong>

                  <small>
                    Room
                    ${esc(
                      entry.room?.room_number ||
                      "?"
                    )}
                  </small>

                </div>


                <div class="room-rank-score">
                  ${Number(
                    entry.score || 0
                  )}
                </div>

              </div>
            `;

          }
        )
        .join("");

}


/* =========================================================
   PROGRESS
========================================================= */

function renderProgress(){

  const current =
    Number(
      session?.current_round ||
      0
    );


  const total =
    Number(
      session?.total_rounds ||
      0
    );


  $("roundProgress")
    .textContent =
      `${current} / ${total}`;


  $("roomScore")
    .textContent =
      Number(
        battleRoom?.score ||
        0
      );


  const rankIndex =
    sessionRooms.findIndex(
      item =>
        item.room_id ===
        room.id
    );


  $("battleRank")
    .textContent =
      rankIndex >= 0
        ? `#${rankIndex + 1}`
        : "—";


  const percent =
    total > 0
      ?
      Math.min(
        100,
        (
          current /
          total
        )
        *
        100
      )
      :
      0;


  $("progressFill")
    .style.width =
      `${percent}%`;

}


/* =========================================================
   LOAD CURRENT ROUND
========================================================= */

async function loadCurrentRound(){

  if(
    !session ||
    session.current_round < 1
  ){

    currentRound = null;

    currentQuestion = null;

    myAnswer = null;

    renderArena();

    return;

  }


  const {
    data,
    error
  } =
    await sb
      .from("game_rounds")
      .select(`
        id,
        session_id,
        round_number,
        title,
        instructions,
        question_id,
        duration_seconds,
        status,
        starts_at,
        ends_at,
        revealed_at,
        scored,
        payload
      `)
      .eq(
        "session_id",
        session.id
      )
      .eq(
        "round_number",
        session.current_round
      )
      .maybeSingle();


  if(error){
    throw error;
  }


  currentRound =
    data || null;


  currentQuestion =
    null;


  myAnswer =
    null;


  if(
    currentRound?.question_id
  ){

    const {
      data: questionData,
      error: questionError
    } =
      await sb
        .from("game_questions")
        .select(`
          id,
          question,
          question_type,
          points
        `)
        .eq(
          "id",
          currentRound.question_id
        )
        .single();


    if(questionError){
      throw questionError;
    }


    currentQuestion =
      questionData;


    const {
      data: answerData,
      error: answerError
    } =
      await sb
        .from("round_answers")
        .select(`
          id,
          answer,
          submitted_at,
          correct,
          points
        `)
        .eq(
          "round_id",
          currentRound.id
        )
        .eq(
          "user_id",
          user.id
        )
        .maybeSingle();


    if(answerError){
      throw answerError;
    }


    myAnswer =
      answerData || null;

  }


  renderArena();

}

/* =========================================================
   TIMER
========================================================= */

function stopTimer(){

  if(timerInterval){

    clearInterval(
      timerInterval
    );

    timerInterval =
      null;

  }

}


function startTimer(){

  stopTimer();


  if(
    !currentRound?.ends_at
  ){
    return;
  }


  const update = () => {

    const end =
      new Date(
        currentRound.ends_at
      ).getTime();


    const remaining =
      Math.max(
        0,
        end - Date.now()
      );


    const seconds =
      Math.ceil(
        remaining /
        1000
      );


    const text =
      $("timerSeconds");


    const ring =
      $("timerRing");


    if(text){

      text.textContent =
        seconds;

    }


    if(ring){

      ring.classList.remove(
        "warning",
        "danger"
      );


      if(
        seconds <= 5
      ){

        ring.classList.add(
          "danger"
        );

      }else if(
        seconds <= 10
      ){

        ring.classList.add(
          "warning"
        );

      }

    }


    if(
      remaining <= 0
    ){

      stopTimer();


      if(
        !myAnswer
      ){

        $("answerStatus")
          .textContent =
            "TIME UP";


        document
          .querySelectorAll(
            "[data-player]"
          )
          .forEach(
            button =>
              button.disabled = true
          );

      }

    }

  };


  update();


  timerInterval =
    setInterval(
      update,
      250
    );

}


/* =========================================================
   SUBMIT ANSWER
========================================================= */

async function submitAnswer(
  selectedUser,
  clickedButton
){

  if(
    !currentRound ||
    myAnswer
  ){
    return;
  }


  const buttons =
    document.querySelectorAll(
      "[data-player]"
    );


  buttons.forEach(
    button =>
      button.disabled = true
  );


  clickedButton
    ?.classList
    .add("selected");


  $("answerStatus")
    .textContent =
      "SUBMITTING...";


  try{

    const {
      error
    } =
      await sb.rpc(
        "submit_roommate_sync_answer",
        {

          p_round_id:
            currentRound.id,

          p_selected_user:
            selectedUser

        }
      );


    if(error){
      throw error;
    }


    const {
      data,
      error: fetchError
    } =
      await sb
        .from("round_answers")
        .select(`
          id,
          answer,
          submitted_at,
          correct,
          points
        `)
        .eq(
          "round_id",
          currentRound.id
        )
        .eq(
          "user_id",
          user.id
        )
        .single();


    if(fetchError){
      throw fetchError;
    }


    myAnswer =
      data;


    $("answerStatus")
      .textContent =
        "ANSWER LOCKED";


    toast(
      "Your answer has been locked.",
      "success"
    );


    renderArena();


  }catch(error){

    console.error(
      "Answer:",
      error
    );


    buttons.forEach(
      button =>
        button.disabled = false
    );


    clickedButton
      ?.classList
      .remove("selected");


    $("answerStatus")
      .textContent =
        "ANSWER NOW";


    toast(
      error.message ||
      "Unable to submit your answer.",
      "error"
    );

  }

}

/* =========================================================
   REALTIME
========================================================= */

function subscribeRealtime(){


  /* -------------------------------------------------------
     SESSION STATUS / CURRENT ROUND
  ------------------------------------------------------- */

  sessionChannel =
    sb
      .channel(
        `battle-session-${session.id}`
      )
      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"game_sessions",
          filter:
            `id=eq.${session.id}`
        },
        async () => {

          try{

            await refreshSession();

          }catch(error){

            console.error(
              "Session realtime:",
              error
            );

          }

        }
      )
      .subscribe();


  /* -------------------------------------------------------
     ROUND CHANGES
  ------------------------------------------------------- */

  roundsChannel =
    sb
      .channel(
        `battle-rounds-${session.id}`
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"game_rounds",
          filter:
            `session_id=eq.${session.id}`
        },
        async () => {

          try{

            await refreshSession();

          }catch(error){

            console.error(
              "Round realtime:",
              error
            );

          }

        }
      )
      .subscribe();


  /* -------------------------------------------------------
     OWN ANSWER
  ------------------------------------------------------- */

  answersChannel =
    sb
      .channel(
        `battle-answers-${user.id}`
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"round_answers",
          filter:
            `user_id=eq.${user.id}`
        },
        async payload => {

          if(
            currentRound &&
            (
              payload.new?.round_id ===
              currentRound.id
              ||
              payload.old?.round_id ===
              currentRound.id
            )
          ){

            try{

              await loadCurrentRound();

            }catch(error){

              console.error(
                "Answer realtime:",
                error
              );

            }

          }

        }
      )
      .subscribe();


  /* -------------------------------------------------------
     LIVE SCORES
  ------------------------------------------------------- */

  scoreChannel =
    sb
      .channel(
        `battle-scores-${session.id}`
      )
      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"session_rooms",
          filter:
            `session_id=eq.${session.id}`
        },
        async () => {

          try{

            await loadBattleLeaderboard();

          }catch(error){

            console.error(
              "Score realtime:",
              error
            );

          }

        }
      )
      .subscribe();

}



/* =========================================================
   WAIT FOR GAME MASTER
========================================================= */

let sessionWatcher = null;

function startSessionWatcher(){

  if(sessionWatcher){
    clearInterval(sessionWatcher);
  }

  sessionWatcher = setInterval(async () => {

    try{

      await loadSession();

      if(!session){
        renderArena();
        return;
      }

      clearInterval(sessionWatcher);
      sessionWatcher = null;

      if(session.residence_id !== room.residence_id){
        throw new Error(
          "This battle belongs to another residence."
        );
      }

      await verifyBattleRoom();
      await loadBattleLeaderboard();
      await loadCurrentRound();

      $("battleTitle").textContent =
        session.title || game.name;

      renderProgress();
      renderArena();
      subscribeRealtime();

      toast(
        session.status === "live"
          ? "Game started."
          : "Game lobby opened.",
        "success"
      );

    }catch(error){
      console.error("Session watcher:",error);
    }

  },1500);

}


/* =========================================================
   INITIALISE
========================================================= */

async function init(){

  try{

    /* -----------------------------------------------------
       AUTH
    ----------------------------------------------------- */

    const {
      data:{
        session: authSession
      },
      error: authError
    } =
      await sb.auth
        .getSession();


    if(authError){
      throw authError;
    }


    if(!authSession?.user){

      location.replace(
        "auth.html"
      );

      return;

    }


    user =
      authSession.user;


    /* -----------------------------------------------------
       PROFILE
    ----------------------------------------------------- */

    const {
      data: profileData,
      error: profileError
    } =
      await sb
        .from("profiles")
        .select(`
          id,
          full_name,
          room_id,
          residence_id
        `)
        .eq(
          "id",
          user.id
        )
        .single();


    if(profileError){
      throw profileError;
    }


    profile =
      profileData;


    if(!profile.room_id){

      location.replace(
        "onboarding.html"
      );

      return;

    }


    /* -----------------------------------------------------
       ROOM
    ----------------------------------------------------- */

    const {
      data: roomData,
      error: roomError
    } =
      await sb
        .from("rooms")
        .select(`
          id,
          residence_id,
          room_number,
          team_name
        `)
        .eq(
          "id",
          profile.room_id
        )
        .single();


    if(roomError){
      throw roomError;
    }


    room =
      roomData;


    /* -----------------------------------------------------
       LOAD
    ----------------------------------------------------- */

    await loadMembers();

    await loadSession();

    /*
      It is normal for there to be no session yet.
      The player can enter the arena before the Game Master presses START GAME.
    */
    if(session){

      if(
        session.residence_id !==
        room.residence_id
      ){
        throw new Error(
          "This battle belongs to another residence."
        );
      }

      await verifyBattleRoom();
      await loadBattleLeaderboard();
      await loadCurrentRound();

    }else{

      battleRoom = null;
      sessionRooms = [];
      rounds = [];
      currentRound = null;
      currentQuestion = null;
      myAnswer = null;

    }


    /* -----------------------------------------------------
       UI
    ----------------------------------------------------- */

    $("teamName")
      .textContent =
        room.team_name ||
        `Room ${room.room_number}`;


    $("roomNumber")
      .textContent =
        `Room ${room.room_number}`;


    $("battleTitle")
      .textContent =
        session?.title ||
        game.name;


    $("battleSubtitle")
      .textContent =
        `${game.name} • My Angel Residence`;


    renderProgress();

    renderArena();


    /* -----------------------------------------------------
       REALTIME
    ----------------------------------------------------- */
    if(session){
      subscribeRealtime();
    }else{
      startSessionWatcher();
    }

    hideLoader();


  }catch(error){

    console.error(
      "Battle init:",
      error
    );


    showFatal(
      error.message ||
      "Unable to enter this battle."
    );

  }

}


init();

</script>
