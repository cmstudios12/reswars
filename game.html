<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0b090b">
  <title>RES WARS | Live Game</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap"
    rel="stylesheet">
  <style>
    html {
      background: #0b090b
    }

    body {
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right)
    }

    :root {
      --o: #ff7818;
      --bg: #0b090b;
      --p: #171217;
      --p2: #21181d;
      --l: #3b2c34;
      --m: #9b8790;
      --g: #9ff06c;
      --r: #ff6677
    }

    * {
      box-sizing: border-box
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: #fff;
      font-family: DM Sans, sans-serif;
      min-width: 320px
    }

    button,
    input,
    textarea {
      font: inherit
    }

    button {
      cursor: pointer
    }

    .hidden {
      display: none !important
    }

    .top {
      height: 64px;
      border-bottom: 1px solid #251c21;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      position: sticky;
      top: 0;
      background: #0b090bf5;
      z-index: 20
    }

    .brand {
      font: 800 13px Manrope
    }

    .brand span {
      color: var(--o)
    }

    .topright {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .livepill {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 8px;
      color: #b9a6ae
    }

    .livepill i {
      width: 7px;
      height: 7px;
      background: var(--g);
      border-radius: 50%
    }

    .back {
      border: 1px solid var(--l);
      background: var(--p);
      color: #cbbac1;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 8px;
      font-weight: 700
    }

    .wrap {
      width: min(720px, calc(100% - 22px));
      margin: 18px auto 55px
    }

    .hero {
      text-align: center;
      padding: 12px 5px 16px
    }

    .hero small {
      color: #ff9c55;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .14em
    }

    .hero h1 {
      font: 800 clamp(27px, 7vw, 42px) Manrope;
      margin: 6px 0
    }

    .hero p {
      margin: 0;
      color: var(--m);
      font-size: 10px
    }

    .card {
      border: 1px solid var(--l);
      background: var(--p);
      border-radius: 18px;
      padding: 17px;
      margin-bottom: 10px
    }

    .roomhead {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px
    }

    .roomhead>div:last-child {
      text-align: right
    }

    .roomhead small {
      display: block;
      font-size: 7px;
      color: #8d7982;
      font-weight: 700
    }

    .roomcode {
      font: 800 20px Manrope;
      letter-spacing: .14em;
      color: var(--o)
    }

    .roundnum {
      font: 800 17px Manrope
    }

    .timer {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
      background: conic-gradient(var(--o) calc(var(--progress, 1)*360deg), #32242b 0);
      margin: auto
    }

    .timer:after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: var(--p)
    }

    .timer strong {
      z-index: 1;
      font: 800 20px Manrope
    }

    .timer small {
      position: absolute;
      z-index: 1;
      top: 42px;
      font-size: 6px;
      color: #a38e97
    }

    .players {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px
    }

    .player {
      padding: 9px 5px;
      border: 1px solid #392b32;
      border-radius: 11px;
      background: #100d10;
      text-align: center;
      min-width: 0
    }

    .av {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #2a1d23;
      margin: auto;
      display: grid;
      place-items: center;
      font-size: 8px;
      font-weight: 800
    }

    .player b {
      display: block;
      font-size: 8px;
      margin-top: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .player span {
      font-size: 6px;
      color: #88747d
    }

    .player.me {
      border-color: #6c493a
    }

    .player.dead {
      opacity: .38
    }

    .btn {
      width: 100%;
      height: 45px;
      border: 0;
      border-radius: 11px;
      background: var(--o);
      color: #1b0d07;
      font-size: 8px;
      font-weight: 800;
      margin-top: 9px
    }

    .btn.alt {
      background: var(--p2);
      color: #e5d5db;
      border: 1px solid #44323a
    }

    .btn.red {
      background: #3a171e;
      color: #ff9daa;
      border: 1px solid #6d2937
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .gamearea {
      text-align: center;
      padding: 19px 5px
    }

    .phase {
      font-size: 7px;
      color: #ff9c55;
      font-weight: 800;
      letter-spacing: .14em
    }

    .gamearea h2 {
      font: 800 23px/1.25 Manrope;
      margin: 10px 0
    }

    .gamearea p {
      color: #9b8790;
      font-size: 10px;
      line-height: 1.55
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 13px
    }

    .option {
      min-height: 48px;
      border: 1px solid #44323a;
      border-radius: 11px;
      background: #21181d;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 9px
    }

    .option:active {
      transform: scale(.98)
    }

    .input {
      width: 100%;
      min-height: 48px;
      border: 1px solid #44323a;
      border-radius: 11px;
      background: #0d0a0d;
      color: #fff;
      padding: 11px 12px;
      outline: none;
      font-size: 16px
    }

    .bigcount {
      font: 800 72px Manrope;
      color: #fff1e8;
      line-height: 1
    }

    .role {
      padding: 16px;
      border: 1px solid #523943;
      border-radius: 13px;
      background: #0e0b0e
    }

    .role span {
      font-size: 7px;
      color: #8f7b84
    }

    .role b {
      display: block;
      font: 800 24px Manrope;
      color: var(--o);
      margin-top: 5px
    }

    .result {
      padding: 14px;
      border: 1px solid #44323a;
      border-radius: 12px;
      background: #0f0c0f;
      color: #f5e8ed;
      font-size: 11px;
      line-height: 1.55
    }

    .score {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #2b2026;
      font-size: 9px
    }

    .score:last-child {
      border-bottom: 0
    }

    .score b {
      color: #fff0e8
    }

    .hostbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    .submitted {
      color: #aef28b !important
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 15px;
      transform: translateX(-50%);
      background: #24191f;
      border: 1px solid #49343e;
      padding: 10px 13px;
      border-radius: 10px;
      font-size: 9px;
      z-index: 50;
      max-width: calc(100% - 25px)
    }

    @media(max-width:520px) {
      .wrap {
        margin-top: 10px
      }

      .hero {
        padding-top: 8px
      }

      .card {
        padding: 13px;
        border-radius: 15px
      }

      .players {
        grid-template-columns: repeat(3, 1fr)
      }

      .roomhead {
        grid-template-columns: 1fr 62px 1fr
      }

      .timer {
        width: 58px;
        height: 58px
      }

      .timer:after {
        inset: 5px
      }

      .timer strong {
        font-size: 17px
      }

      .timer small {
        top: 35px
      }

      .gamearea h2 {
        font-size: 19px
      }

      .options {
        grid-template-columns: 1fr
      }

      .hostbar {
        grid-template-columns: 1fr
      }

      .bigcount {
        font-size: 59px
      }
    }

    .ready-overlay {
      position: fixed;
      inset: 0;
      z-index: 190;
      background: #080608f2;
      display: grid;
      place-items: center;
      padding: 18px
    }

    .ready-box {
      width: min(470px, 100%);
      background: #171217;
      border: 1px solid #513a43;
      border-radius: 22px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 30px 100px #000d
    }

    .ready-ey {
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .16em;
      color: #ff8b3d
    }

    .ready-box h2 {
      font-size: 27px;
      margin: 8px 0 4px
    }

    .ready-box p {
      font-size: 11px;
      color: #9d8992;
      line-height: 1.55
    }

    .ready-list {
      display: grid;
      gap: 7px;
      margin: 16px 0;
      text-align: left
    }

    .ready-person {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px;
      border: 1px solid #35282e;
      border-radius: 11px;
      background: #100d10
    }

    .ready-person b {
      font-size: 11px
    }

    .ready-person span:last-child {
      margin-left: auto;
      font-size: 8px;
      font-weight: 900
    }

    .rdot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #68565e
    }

    .rdot.on {
      background: #94ef6e;
      box-shadow: 0 0 0 4px #94ef6e15
    }

    .ready-btn {
      width: 100%;
      height: 45px;
      border: 1px solid #ff7818;
      border-radius: 10px;
      background: #ff7818;
      color: #190c06;
      font-size: 10px;
      font-weight: 900
    }

    .ready-btn.secondary {
      margin-top: 8px;
      background: #21181d;
      border-color: #493640;
      color: #e8dce1
    }

    .ready-btn:disabled {
      opacity: .35
    }

    .big-count {
      font-size: 88px;
      font-weight: 900;
      line-height: 1;
      color: #ff7818;
      margin: 10px 0
    }

    .hidden {
      display: none !important
    }

    .result-overlay {
      position: fixed;
      inset: 0;
      z-index: 310;
      background: #070507f4;
      display: grid;
      place-items: center;
      padding: 18px
    }

    .result-card {
      width: min(430px, 100%);
      background: #181217;
      border: 1px solid #5a3b2d;
      border-radius: 22px;
      padding: 23px;
      text-align: center;
      box-shadow: 0 30px 100px #000e
    }

    .result-card .ey {
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .15em;
      color: #ff8a38
    }

    .result-card h2 {
      font-size: 29px;
      margin: 8px 0
    }

    .result-xp {
      font-size: 38px;
      font-weight: 900;
      color: #ff7818;
      margin: 13px 0
    }

    .result-card p {
      font-size: 10px;
      color: #9d8992;
      line-height: 1.55
    }

    .result-card button {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 10px;
      background: #ff7818;
      color: #190c06;
      font-size: 9px;
      font-weight: 900;
      margin-top: 12px
    }
  </style>

  <style>
    /* =========================================================
   RES WARS — INSTALLED APP / MOBILE SCREEN FIT
   Keeps every page inside the visible PWA viewport.
========================================================= */
    :root {
      --rw-safe-top: env(safe-area-inset-top, 0px);
      --rw-safe-right: env(safe-area-inset-right, 0px);
      --rw-safe-bottom: env(safe-area-inset-bottom, 0px);
      --rw-safe-left: env(safe-area-inset-left, 0px);
      --rw-vh: 100dvh;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    html {
      width: 100%;
      max-width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      background: #0b090b;
    }

    body {
      width: 100%;
      max-width: 100vw;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      overscroll-behavior-y: none;
      padding-left: var(--rw-safe-left) !important;
      padding-right: var(--rw-safe-right) !important;
    }

    img,
    video,
    canvas,
    svg {
      max-width: 100%;
      height: auto
    }

    input,
    select,
    textarea,
    button {
      max-width: 100%;
      font: inherit
    }

    main,
    .wrap,
    .shell,
    .app,
    .page,
    .content,
    .container,
    .game-shell,
    .game-wrap {
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .modalbg,
    .invite-modal-bg,
    .ready-overlay,
    .result-overlay,
    .install-sheet {
      width: 100vw;
      width: 100dvw;
      height: 100vh;
      height: 100dvh;
      max-width: 100%;
      padding-top: max(12px, var(--rw-safe-top)) !important;
      padding-right: max(12px, var(--rw-safe-right)) !important;
      padding-bottom: max(12px, var(--rw-safe-bottom)) !important;
      padding-left: max(12px, var(--rw-safe-left)) !important;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .modal,
    .invite-modal,
    .ready-box,
    .result-card,
    .install-box {
      width: min(100%, 500px) !important;
      max-width: 100% !important;
      max-height: calc(100dvh - var(--rw-safe-top) - var(--rw-safe-bottom) - 24px);
      overflow-y: auto;
    }

    @media (display-mode:standalone) {
      body {
        min-height: 100dvh
      }
    }

    @media(max-width:760px) {
      body {
        font-size: 16px
      }

      .wrap,
      .shell,
      .app,
      .page,
      .content,
      .container,
      .game-shell,
      .game-wrap {
        padding-left: max(12px, var(--rw-safe-left));
        padding-right: max(12px, var(--rw-safe-right));
      }

      .grid,
      .games,
      .game-grid,
      .stats,
      .cards,
      .two,
      .cols,
      .columns {
        min-width: 0;
        max-width: 100%;
      }

      .card,
      .game-card,
      .panel,
      .stat,
      .room-hero,
      .roommate-card {
        min-width: 0;
        max-width: 100%;
      }
    }

    body {
      min-height: 100dvh !important
    }

    @media(max-width:760px) {

      .top,
      .topbar,
      header {
        padding-top: max(10px, var(--rw-safe-top)) !important
      }

      .game,
      .arena,
      .stage,
      .board {
        max-width: 100% !important;
        min-width: 0 !important
      }

      .actions,
      .controls {
        max-width: 100% !important;
        flex-wrap: wrap
      }
    }
  </style>
  <style>
    /* =========================================================
   RES WARS TRUE APP FIT — hard mobile viewport correction
========================================================= */
    html,
    body {
      width: 100% !important;
      min-width: 0 !important;
      max-width: 100% !important;
      margin: 0 !important;
      overflow-x: clip !important;
    }

    html {
      height: 100%;
      background: #0b090b
    }

    body {
      min-height: 100svh !important;
      min-height: 100dvh !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }

    body>* {
      max-width: 100vw
    }

    .wrap,
    .shell,
    .container,
    .content,
    .page,
    .app,
    .game-shell,
    .game-wrap {
      width: 100% !important;
      min-width: 0 !important;
      max-width: 100% !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }

    @media(max-width:760px) {

      html,
      body {
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100% !important
      }

      body {
        font-size: 14px !important
      }

      .wrap,
      .shell,
      .container,
      .content,
      .page,
      .app,
      .game-shell,
      .game-wrap {
        padding-left: 12px !important;
        padding-right: 12px !important;
      }

      header,
      .header,
      .top,
      .topbar,
      .top-bar {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        left: 0 !important;
        right: 0 !important;
      }

      .grid,
      .games,
      .game-grid,
      .cards,
      .stats,
      .two,
      .cols,
      .columns,
      .hero,
      .hero-grid,
      .dashboard-grid,
      .profile-grid,
      .entrygrid {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
      }

      .game-card,
      .card,
      .panel,
      .stat,
      .member,
      .roommate-card,
      .room-hero,

        max-width: 100% !important;

      }

      h1,
      h2,
      h3,
      p,
      span,
      b,
      small {
        overflow-wrap: anywhere
      }
    }

    @media(max-width:760px) {
      body {
        height: 100dvh !important;
        min-height: 100dvh !important;
        overflow: hidden !important
      }

      .top {
        height: 56px !important;
        padding: 0 10px !important;
        padding-top: env(safe-area-inset-top, 0px) !important
      }

      .setup,
      .arena,
      .game,
      .stage,
      .board,
      .lobby {
        max-width: 100vw !important;
        overflow-x: hidden !important
      }

      .ready-overlay,
      .result-overlay {
        inset: 0 !important;
        width: 100% !important;
        height: 100dvh !important
      }

      .ready-box,
      .result-card {
        width: calc(100vw - 24px) !important;
        max-height: calc(100dvh - 24px) !important
      }
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="brand">RES <span>WARS</span></div>
    <div class="topright">
      <div class="livepill"><i></i> LIVE</div><button class="back" onclick="location.href='index.html'">HOME</button>
    </div>
  </header>
  <main class="wrap">
    <section class="hero"><small>LIVE RES GAME</small>
      <h1 id="title">Loading...</h1>
      <p id="desc"></p>
    </section>
    <section id="setup" class="card">
      <div style="text-align:center;color:#a28e97;font-size:10px">Host a new room or join your friends.</div><button
        id="hostBtn" class="btn" onclick="host()">HOST THIS GAME</button><input id="joinCode" class="input"
        maxlength="6" placeholder="6-character room code"
        style="margin-top:9px;text-align:center;text-transform:uppercase"><button class="btn alt" onclick="join()">JOIN
        ROOM</button>
    </section>
    <section id="room" class="hidden">
      <div class="card roomhead">
        <div><small>ROOM</small>
          <div id="code" class="roomcode">------</div>
        </div>
        <div id="timer" class="timer"><strong id="seconds">--</strong><small>SECONDS</small></div>
        <div><small>ROUND</small>
          <div id="roundNo" class="roundnum">00</div>
        </div>
      </div>
      <div class="card">
        <div id="players" class="players"></div><button id="start" class="btn hidden" onclick="start()">START
          GAME</button>
      </div>
      <div id="liveCard" class="card hidden">
        <div id="gameArea" class="gamearea"></div>
        <div id="hostbar" class="hostbar hidden"><button id="closeRound" class="btn alt" onclick="closeRound()">SHOW
            RESULT / CLOSE ROUND</button><button id="next" class="btn" onclick="nextRound()">NEXT ROUND</button></div>
        <button id="end" class="btn red hidden" onclick="endGame()">END GAME</button>
      </div>
      <div id="scoreCard" class="card hidden">
        <div style="font-size:8px;color:#8d7982;font-weight:800">LIVE SCOREBOARD</div>
        <div id="scores"></div>
      </div>
    </section>
  </main>
  <div id="readyOverlay" class="ready-overlay hidden">
    <div class="ready-box">
      <div class="ready-ey" id="readyState">GAME LOBBY</div>
      <h2 id="readyTitle">GET READY</h2>
      <p id="readyCopy">Everyone must be ready before the game starts.</p>
      <div id="readyCount" class="big-count hidden">5</div>
      <div id="readyList" class="ready-list"></div>
      <button id="myReadyBtn" class="ready-btn" onclick="toggleMyReady()">I'M READY</button>
